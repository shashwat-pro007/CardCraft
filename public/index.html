<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CardCraft - Virtual College ID System</title>

    <!-- Tailwind CDN (simple - no build step) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- html2canvas & jsPDF via CDN are NOT required since we use npm modules,
         but keeping only Tailwind here for styling. -->
    <style>
      /* Custom scrollbar for better visual */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #f1f1f1; }
      ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #64748b; }
      #id-card-container {
          width: 350px;
          height: 220px;
          box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
          margin: 20px auto;
          border-radius: 12px;
          background-color: white;
          padding: 16px;
          display: flex;
          gap: 12px;
          position: relative;
      }
    </style>

    <script>
      tailwind.config = {
          theme: {
              extend: {
                  colors: {
                      'primary-blue': '#1e3a8a',
                      'secondary-blue': '#3b82f6',
                      'accent-yellow': '#facc15',
                  },
              },
          },
      }
    </script>
  </head>
  <body class="bg-gray-100 min-h-screen flex flex-col font-sans">
    <div id="root"></div>
  </body>
</html>
